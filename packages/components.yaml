components:
  schemas:
    Event:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        player:
          type: string
        count:
          type: integer
        x:
          type: double
        y:
          type: double
        z:
          type: double
        server:
          type: string
        sourceIP:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
      example:
        name: joined-network
        player: 4Ply
        server: lobby
        sourceIP: '127.0.0.1'
        x: 0
        y: 0
        z: 0
        count: 1
        metadata:
          deck-id: 1
          run-id: 123123-123-123-123-123
          slug: practice
          world-age: 123123123

    Card:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        player:
          type: string
        server:
          type: string
        deckType:
          type: string
        hiddenInDecks:
          type: array
          items:
            type: string
      example:
        name: MOC
        player: 4Ply
        server: lobby
        deckType: 'p'

    Item:
      allOf:
        - $ref: '#/components/schemas/Card'
        - example:
            name: crown
            player: 4Ply
            server: lobby
            deckType: 'p'

    Task:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        arguments:
          type: array
          items:
            type: string
        targetPlayer:
          type: string
        server:
          type: string
        sourceIP:
          type: string
        createdAt:
          type: string
      example:
        type: bungee-message
        targetPlayer: 4Ply
        arguments:
          - Connect
          - builders
        server: lobby
        sourceIP: '127.0.0.1'

    Score:
      type: object
      properties:
        id:
          type: string
        player:
          type: string
        slug:
          type: string
          description: League namespace the score belongs to
        key:
          type: string
        value:
          type: number
        metadata:
          type: object
          additionalProperties:
            type: string
      example:
        player: 4Ply
        slug: do2-s2-practice
        key: do2.wins
        value: 1
        metadata:
          deck-id: 1
          run-id: 123123-123-123-123-123
          world-age: 123123123

    Config:
      type: object
      properties:
        id:
          type: string
        entity:
          type: string
        key:
          type: string
        value:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
      example:
        entity: d800
        key: dungeon-type
        value: do2-s2-comp

    Claim:
      type: object
      properties:
        id:
          type: string
        player:
          type: string
        claimant:
          type: string
        type:
          type: string
        state:
          type: string
        stateReason:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
      example:
        player: 4Ply
        type: dungeon
        state: pending
        metadata:
          deck-id: 1
          run-id: 123123-123-123-123-123
          slug: practice
          tome-count: 1

    StatusSection:
      type: object
      properties:
        header:
          type: string
        lines:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              value:
                type: number
      example:
        header: Instances
        lines:
          - key: Total
            value: 3

    Status:
      type: array
      items:
        $ref: '#/components/schemas/StatusSection'
      example:
        - header: Instances
          lines:
            - key: Total
              value: 3

    Error:
      type: object
      properties:
        code:
          type: number
        message:
          type: string

    Party:
      type: object
      properties:
        id:
          type: string
        leader:
          type: string
        slug:
          type: string
          description: League the party plays
        members:
          type: array
          items:
            type: string
        invites:
          type: array
          items:
            type: string
        state:
          type: string
        claimId:
          type: string
      example:
        leader: 4Ply
        slug: do2-s2-practice
        members:
          - 4Ply
          - TangoTek
        invites: []
        state: forming

    LeagueAsset:
      type: object
      properties:
        repo:
          type: string
        asset:
          type: string
        version:
          type: string
        enabled:
          type: boolean
        authenticated:
          type: boolean

    LeagueServer:
      type: object
      properties:
        dungeonType:
          type: string
        claimFilters:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        worldSource:
          type: string
          enum: [restic, s3-zip]
        minecraft:
          type: object
          properties:
            version:
              type: string
        datapacks:
          type: array
          items:
            $ref: '#/components/schemas/LeagueAsset'
        mods:
          type: array
          items:
            $ref: '#/components/schemas/LeagueAsset'
        resourcePack:
          type: object
          properties:
            url:
              type: string
            sha1:
              type: string
            modernUrl:
              type: string
            modernSha1:
              type: string

    LeagueParty:
      type: object
      description: Party size limits, leader included. A league with maxPlayers 1 does not offer parties
      properties:
        minPlayers:
          type: integer
        maxPlayers:
          type: integer

    League:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        displayName:
          type: string
        description:
          type: string
        owner:
          type: string
        display:
          type: object
          properties:
            runTypeId:
              type: integer
            colour:
              type: integer
            material:
              type: string
        members:
          type: array
          items:
            type: string
        joinPolicy:
          type: string
        builders:
          type: object
          properties:
            players:
              type: array
              items:
                type: string
            idleTimeoutMinutes:
              type: integer
            snapshotSource:
              type: string
        items:
          type: object
          additionalProperties:
            type: object
        trades:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              source:
                type: object
                properties:
                  item:
                    type: string
                  amount:
                    type: integer
              target:
                type: object
                properties:
                  type:
                    type: string
                  item:
                    type: string
                  amount:
                    type: integer
        deck:
          type: object
          properties:
            defaultCards:
              type: array
              items:
                type: string
        server:
          $ref: '#/components/schemas/LeagueServer'
        party:
          $ref: '#/components/schemas/LeagueParty'
        phases:
          type: array
          items:
            type: object
            properties:
              phase:
                type: integer
              state:
                type: string
              start:
                type: string
              end:
                type: string
        phaseTransition:
          type: object
          properties:
            autoTransition:
              type: boolean
            allocation:
              type: object
              properties:
                type:
                  type: string
            actions:
              type: array
              items:
                type: string
        scoring:
          type: object
          properties:
            metric:
              type: string
            pointsForPosition:
              type: array
              items:
                type: integer
        eventHandlers:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              trigger:
                type: object
                properties:
                  event:
                    type: string
                  condition:
                    type: object
              actions:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    scoreboard:
                      type: string
                    value:
                      type: number
                    pattern:
                      type: string
                    sourcePattern:
                      type: string
                    targetPrefix:
                      type: string
        state:
          type: string
      example:
        slug: competitive
        displayName: Competitive
        description: The main competitive season
        owner: 4Ply
        display:
          colour: 5636095
          material: CYAN_SHULKER_BOX
        members: []
        joinPolicy: auto
        state: active

    LeagueSandboxInstance:
      type: object
      properties:
        id:
          type: string
        leagueSlug:
          type: string
        slot:
          type: string
        taskArn:
          type: string
        privateIp:
          type: string
        state:
          type: string
          enum:
            - LAUNCHING
            - RUNNING
            - STOPPING
            - STOPPED
        lastPlayerActivity:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    LeagueBuilderAllowlistEntry:
      type: object
      properties:
        name:
          type: string

    LeagueMemberRequest:
      type: object
      required:
        - player
      properties:
        player:
          type: string

    LeagueCreateRequest:
      type: object
      required:
        - slug
        - displayName
        - owner
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9-]+$'
        displayName:
          type: string
        owner:
          type: string
        builders:
          type: object
          properties:
            players:
              type: array
              items:
                type: string
            idleTimeoutMinutes:
              type: integer
              minimum: 5
              maximum: 120

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 401
            message: Please authenticate
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 403
            message: Forbidden
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 404
            message: Not found
